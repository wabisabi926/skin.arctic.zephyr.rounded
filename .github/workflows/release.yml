name: Release skin package

on:
  push:
    branches: [ douban-Piers ]
    paths:
      - addon.xml
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建 zip 并覆盖同名资产'
        type: boolean
        default: false
      update_notes:
        description: '刷新已存在 Release 的更新日志（不改动资产）'
        type: boolean
        default: true
      skip_texture_repack:
        description: '应急：完全跳过纹理处理，按仓库原样打包（散图保留）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'wabisabi926/skin.arctic.zephyr.rounded'
    # 固定在 24.04：ubuntu-latest 自 2026-10 迁至 Ubuntu 26，工具链依赖不稳定
    runs-on: ubuntu-24.04
    # 纹理 V3 重打包需编译 TexturePacker + 解包/重打包约 2400 张纹理
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整提交历史与全部 tag，才能生成跨版本的 changelog
          fetch-depth: 0
          fetch-tags: true

      - name: Read addon id and version
        id: meta
        run: |
          set -euo pipefail
          ID=$(python3 -c "import xml.etree.ElementTree as ET;print(ET.parse('addon.xml').getroot().get('id'))")
          VER=$(python3 -c "import xml.etree.ElementTree as ET;print(ET.parse('addon.xml').getroot().get('version'))")

          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::addon.xml 版本号格式异常: $VER"
            exit 1
          fi

          BRANCH="${GITHUB_REF_NAME//\//-}"

          {
            echo "id=$ID"
            echo "ver=$VER"
            echo "branch=$BRANCH"
            echo "tag=$BRANCH-$VER"
            echo "asset=$ID-$BRANCH-$VER.zip"
          } >> "$GITHUB_OUTPUT"

          echo "addon id : $ID"
          echo "version  : $VER"
          echo "branch   : $BRANCH"

      - name: Detect media layout
        id: textures
        env:
          SKIP: ${{ inputs.skip_texture_repack }}
        run: |
          set -euo pipefail

          # 判定阈值：media/ 下只要存在被跟踪的散图，即进入 V3 重打包分支
          LOOSE=$(git ls-files media/ | grep -Ei '\.(png|jpe?g|gif)$' || true)
          if [ -f media/Textures.xbt ]; then HAS_XBT=true; else HAS_XBT=false; fi

          if [ "$HAS_XBT" = "false" ] && [ -z "$LOOSE" ]; then
            echo "::error::media/ 既无 Textures.xbt 也无散图"
            exit 1
          fi

          if [ "${SKIP:-false}" = "true" ]; then
            echo "::notice::skip_texture_repack=true，按仓库原样打包"
            REPACK=false
          elif [ -n "$LOOSE" ]; then
            REPACK=true
          else
            REPACK=false
          fi

          { echo "repack=$REPACK"; echo "has_xbt=$HAS_XBT"; } >> "$GITHUB_OUTPUT"

          if [ -n "$LOOSE" ]; then
            echo "media/ 散图数: $(wc -l <<< "$LOOSE")"
            echo "$LOOSE"
          else
            echo "media/ 散图数: 0（仅 Textures.xbt，跳过重打包）"
          fi
          echo "XBT v3 重打包: $REPACK"

      - name: Resolve xbmc ref
        if: steps.textures.outputs.repack == 'true'
        id: xbmc
        run: |
          set -euo pipefail
          SHA=$(git ls-remote https://github.com/xbmc/xbmc.git refs/heads/master | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "xbmc master (Kodi 22 Piers): $SHA"

      - name: Cache TexturePacker
        if: steps.textures.outputs.repack == 'true'
        id: tpcache
        uses: actions/cache@v4
        with:
          path: /tmp/TexturePacker
          key: texturepacker-${{ runner.os }}-${{ steps.xbmc.outputs.sha }}

      - name: Build Kodi 22 TexturePacker
        if: steps.textures.outputs.repack == 'true' && steps.tpcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          fail() { echo "::error::TexturePacker 构建阶段 [$1] 失败, exit=$2"; exit "$2"; }

          echo "::group::apt"
          sudo apt-get update -qq || fail "apt-get update" "$?"
          sudo apt-get install -y -qq \
            liblzo2-dev libpng-dev libgif-dev libjpeg-dev cmake g++ \
            || fail "apt-get install" "$?"
          echo "::endgroup::"

          echo "::group::clone"
          # 完整 depth-1 检出：decoder/ 与 XBTF 会引用 guilib 之外的头，sparse 易漏
          git clone --depth 1 https://github.com/xbmc/xbmc.git /tmp/xbmc \
            || fail "git clone xbmc" "$?"
          echo "::endgroup::"

          # 硬校验：确认源码树输出 XBT v3（Kodi 22 / Piers）
          if ! grep -Eq 'XBTF_VERSION[[:space:]]*=[[:space:]]*"3"' /tmp/xbmc/xbmc/guilib/XBTF.h; then
            echo "::error::xbmc 源码树不是 XBT v3，拒绝产出错误格式"
            grep -n 'XBTF_VERSION' /tmp/xbmc/xbmc/guilib/XBTF.h || true
            exit 1
          fi

          echo "::group::cmake configure"
          cmake -S /tmp/xbmc/tools/depends/native/TexturePacker/src \
                -B /tmp/tp-build \
                -DKODI_SOURCE_DIR=/tmp/xbmc \
                -DCMAKE_BUILD_TYPE=Release \
                "-DCMAKE_CXX_FLAGS=-DTARGET_POSIX" \
            || fail "cmake configure" "$?"
          echo "::endgroup::"

          echo "::group::cmake build"
          rc=0
          cmake --build /tmp/tp-build --parallel 2 > /tmp/tp-build.log 2>&1 || rc=$?
          tail -n 40 /tmp/tp-build.log
          if [ "$rc" -ne 0 ]; then
            python3 - << 'PYEOF'
          lines = open('/tmp/tp-build.log', errors='replace').read().splitlines()
          tail = [l for l in lines if 'error:' in l.lower() or 'fatal' in l.lower()][:12] or lines[-20:]
          enc = '\n'.join(tail).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::cmake build 输出:' + enc)
          PYEOF
            fail "cmake build" "$rc"
          fi
          echo "::endgroup::"

          cp /tmp/tp-build/TexturePacker /tmp/TexturePacker || fail "cp binary" "$?"
          chmod +x /tmp/TexturePacker

      - name: Repack media to XBT v3
        if: steps.textures.outputs.repack == 'true'
        run: |
          set -euo pipefail
          trap 'rc=$?; trap - ERR; echo "::error::Repack 失败于: $BASH_COMMAND (exit $rc)"; exit $rc' ERR

          # 1) 记录原 xbt 的纹理条目数（magic 4B + version 1B + uint32 count）
          python3 - << 'PYEOF' > /tmp/orig_count
          import struct
          try:
              b = open('media/Textures.xbt', 'rb').read(9)
              print(struct.unpack('<I', b[5:9])[0] if b[:4] == b'XBTF' else 0)
          except Exception:
              print(0)
          PYEOF
          echo "原 XBT 纹理条目数: $(cat /tmp/orig_count)"

          # 2) 解包器：固定 v1.0.9 Linux x64，避免运行时 API / jq 依赖
          curl -fsSL -o /tmp/kodixbttool \
            "https://github.com/benjarogit/kodixbttool/releases/download/v1.0.9/kodixbttool-linux-x64"
          echo "b1824314e14768de2ac97fcbc9223a80f7f0d31b0e5aafcdeef80d1fa27405ad  /tmp/kodixbttool" | sha256sum -c -
          chmod +x /tmp/kodixbttool

          # 2a) 运行期依赖自检：该二进制动态链接 libsquish.so.0，
          #     Build 步骤可能被缓存命中而跳过，必须在此独立保证
          MISSING=$(ldd /tmp/kodixbttool 2>&1 | grep 'not found' || true)
          if [ -n "$MISSING" ]; then
            echo "::notice::解包器缺少运行库，补装: $MISSING"
            sudo apt-get update -qq
            sudo apt-get install -y -qq libsquish0 liblzo2-dev libpng-dev libgif-dev libjpeg-dev
          fi
          ldd /tmp/kodixbttool
          if ldd /tmp/kodixbttool 2>&1 | grep -q 'not found'; then
            echo "::error::解包器运行库仍缺失，无法解包 XBT"
            exit 1
          fi

          # 2b) 可执行性与路径结构自检：失败时给出明确原因，而不是裸 exit 127
          if ! /tmp/kodixbttool -p media/Textures.xbt > /tmp/xbt.list 2>/tmp/xbt.err; then
            echo "::error::kodixbttool 无法执行或无法解析现有 xbt"
            cat /tmp/xbt.err
            exit 1
          fi
          echo "XBT 内路径数: $(wc -l < /tmp/xbt.list)"
          head -3 /tmp/xbt.list

          # 3) 解包现有 xbt，得到完整散图源
          rm -rf /tmp/tex && mkdir -p /tmp/tex
          if [ "${{ steps.textures.outputs.has_xbt }}" = "true" ]; then
            /tmp/kodixbttool -o /tmp/tex -c media/Textures.xbt
            # 路径结构锚点：原 xbt 首个纹理必须落在解包根目录
            if [ ! -f /tmp/tex/defaultactor.png ]; then
              echo "::error::解包目录结构与原 xbt 路径不一致，中止以防纹理引用失效"
              find /tmp/tex -maxdepth 2 | head -20
              exit 1
            fi
          fi

          # 4) 合并 media/ 下的散图，保持相对 media/ 的路径
          while IFS= read -r f; do
            rel="${f#media/}"
            mkdir -p "/tmp/tex/$(dirname "$rel")"
            cp "media/$rel" "/tmp/tex/$rel"
          done < <(git ls-files media/ | grep -Ei '\.(png|jpe?g|gif)$' || true)

          SRC_COUNT=$(find /tmp/tex -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' \) | wc -l)
          echo "打包输入纹理数: $SRC_COUNT"
          if [ "$SRC_COUNT" -lt "$(cat /tmp/orig_count)" ] || [ "$SRC_COUNT" -lt 1 ]; then
            echo "::error::输入纹理数少于原 xbt，中止以防纹理丢失"
            exit 1
          fi

          # 5) Kodi 22 TexturePacker 输出 XBT v3
          /tmp/TexturePacker -dupecheck -input /tmp/tex -output /tmp/Textures.v3.xbt

          # 6) 硬校验：v3 格式 / 条目数不缩水 / 豆瓣纹理已入包
          python3 - << 'PYEOF'
          import struct
          b = open('/tmp/Textures.v3.xbt', 'rb').read()
          if b[:5] != b'XBTF3':
              raise SystemExit('::error::生成的纹理包不是 XBT v3 (magic=%r)' % b[:5])
          new = struct.unpack('<I', b[5:9])[0]
          orig = int(open('/tmp/orig_count').read().strip())
          if orig and new < orig:
              raise SystemExit('::error::纹理条目缩水 %d -> %d' % (orig, new))
          if b'douban' not in b:
              raise SystemExit('::error::新 xbt 中缺少 douban 纹理')
          print('XBT v3 校验通过: %d 条目, %d bytes' % (new, len(b)))
          PYEOF

          cp /tmp/Textures.v3.xbt media/Textures.xbt
          echo "已生成: $(du -h media/Textures.xbt | cut -f1)"

      - name: Build zip with git archive
        env:
          REPACK: ${{ steps.textures.outputs.repack }}
        run: |
          set -euo pipefail
          # .gitattributes 中已声明 export-ignore：
          #   .gitignore / .gitattributes / .github
          # 因此 git archive 会自动排除这三项，且只打包已跟踪文件。
          ID="${{ steps.meta.outputs.id }}"
          ASSET="${{ steps.meta.outputs.asset }}"

          git archive --format=zip --prefix="$ID/" -o "$ASSET" HEAD

          if [ "$REPACK" = "true" ]; then
            # 发布态只保留 Textures.xbt：排除散图，以及 git archive 为散图生成的空目录条目
            unzip -Z1 "$ASSET" \
              | grep -Ei "^${ID}/media/.+/$|^${ID}/media/.*\.(png|jpe?g|gif)$" > /tmp/prune.list || true
            if [ -s /tmp/prune.list ]; then
              xargs -a /tmp/prune.list -d '\n' -r zip -d "$ASSET" >/dev/null
              echo "已排除 media/ 散图与空目录 $(wc -l < /tmp/prune.list) 项"
            fi

            # git archive 打的是仓库里的旧 xbt，用新生成的 XBT v3 替换
            # 纯散图分支中该条目本就不存在，删除失败属正常
            zip -d "$ASSET" "$ID/media/Textures.xbt" >/dev/null || true
            mkdir -p "/tmp/stage/$ID/media"
            cp media/Textures.xbt "/tmp/stage/$ID/media/Textures.xbt"
            (cd /tmp/stage && zip -q "$GITHUB_WORKSPACE/$ASSET" "$ID/media/Textures.xbt")
            echo "已注入 XBT v3 纹理包"
          fi
          ls -lh "$ASSET"

      - name: Verify zip contents
        env:
          REPACK: ${{ steps.textures.outputs.repack }}
        run: |
          set -euo pipefail
          ZIP="${{ steps.meta.outputs.asset }}"
          ID="${{ steps.meta.outputs.id }}"
          LIST=$(unzip -Z1 "$ZIP")

          echo "entries: $(wc -l <<< "$LIST")"
          echo "size   : $(du -h "$ZIP" | cut -f1)"

          if ! grep -qx "$ID/addon.xml" <<< "$LIST"; then
            echo "::error::zip 中缺少 $ID/addon.xml"
            exit 1
          fi

          if grep -Eq '^(\.git|\.github|\.gitignore|\.gitattributes)(/|$)' <<< "$LIST"; then
            echo "::error::zip 中包含应排除的路径"
            grep -E '^(\.git|\.github|\.gitignore|\.gitattributes)(/|$)' <<< "$LIST" | head -20
            exit 1
          fi

          if grep -Eq '^\.workbuddy(/|$)' <<< "$LIST"; then
            echo "::error::zip 中包含未跟踪目录 .workbuddy"
            exit 1
          fi

          if [ "$REPACK" = "true" ]; then
            if grep -Eqi "^${ID}/media/.*\.(png|jpe?g|gif)$" <<< "$LIST"; then
              echo "::error::发布包仍含 media/ 散图"
              exit 1
            fi
            # media/ 下只允许目录条目自身与 Textures.xbt，禁止残留任何空子目录
            EXTRA=$(grep -E "^${ID}/media/" <<< "$LIST" \
              | grep -v -x -F -e "${ID}/media/" -e "${ID}/media/Textures.xbt" || true)
            if [ -n "$EXTRA" ]; then
              echo "::error::发布包 media/ 下仍有多余条目（散图或空目录）:"
              echo "$EXTRA" | head -20
              exit 1
            fi
            # 直接读 zip 内 xbt 头部，确认是 XBT v3 且未被旧包覆盖
            python3 - << PYEOF
          import zipfile
          z = zipfile.ZipFile("$ZIP")
          head = z.open("$ID/media/Textures.xbt").read(5)
          if head != b"XBTF3":
              raise SystemExit("::error::发布包内 Textures.xbt 不是 XBT v3 (magic=%r)" % head)
          print("发布包纹理格式: XBT v3")
          PYEOF
          fi

          echo "zip 结构校验通过"

      - name: Generate changelog
        id: changelog
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          # 取上一个版本 tag：排除当前版本（此时新 tag 通常尚未由本流程创建）
          PREV_TAG=$(git tag -l "${{ steps.meta.outputs.branch }}-*" --sort=-v:refname \
            | grep -v -x "$TAG" | head -n 1 || true)

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          echo "changelog range: $RANGE"

          CHANGELOG=$(RANGE="$RANGE" python3 << 'PYEOF'
          import os, re, subprocess

          range_arg = os.environ.get("RANGE", "HEAD")

          # 获取非 merge commit
          out = subprocess.check_output(
              ["git", "log", "--no-merges", "--format=%s", range_arg],
              text=True
          ).strip().splitlines()

          # 分类规则（Kodi skin changelog 风格，章节标题用中文）
          CAT_NEW     = []   # 新增
          CAT_IMPROVE = []   # 优化
          CAT_FIX     = []   # 修复
          CAT_REMOVE  = []   # 移除
          CAT_REWORK  = []   # 重构
          CAT_COSMETIC= []   # 外观
          CAT_OTHER   = []   # 其他

          SKIP_PATTERNS = [
              r"^VERSION\b",
              r"^cosmetic\s*$",
              r"^code\s*[- ]+(cleanup|fix|cosmetic|comment|missing|refactoring)\s*$",
              r"^code\s*[- ]+(cleanup|fix|cosmetic|comment|missing|refactoring)\s*\d*\s*$",
              r"^misc\s*-\s*(cosmetic|improvement|fix|minor)\s*$",
              r"^code refactoring\s*$",
              r"^code\s*$",
              r"^\?\?\?",
              r"^typo\b",
              r"^comment\b",
              r"^cleanup\s*$",
              r"^code\s*-\s*comment\s*-\s*cleanup\s*$",
              r"^misc\s*-\s*cosmetic\s*$",
              # 工程类提交不进入面向用户的更新日志
              r"^(ci|chore|docs|build|test|style|perf)(\(.+\))?:",
              r"^Merge\b",
          ]

          def should_skip(s):
              for p in SKIP_PATTERNS:
                  if re.match(p, s, re.I):
                      return True
              return False

          def clean_msg(s):
              # 去掉中间冗余的类型标签（分类已由章节标题承载）
              s = re.sub(r'\s*-\s*new feature\s*-\s*', ' - ', s, flags=re.I)
              # 去掉尾部编号后缀 partN / fixN / wipN 等
              s = re.sub(r'\s+part\s*\d+\s*$', '', s, flags=re.I)
              s = re.sub(r'\s+fix\s*\d*\s*$', '', s, flags=re.I)
              s = re.sub(r'\s+cosmetic\s*\d*\s*$', '', s, flags=re.I)
              s = re.sub(r'\s+wip\s*\d+\s*$', '', s, flags=re.I)
              s = re.sub(r'\s+improvement\s*\d*\s*$', '', s, flags=re.I)
              # 去掉 - 分隔的尾缀
              s = re.sub(r'\s*-\s*part\s*\d+\s*$', '', s, flags=re.I)
              s = re.sub(r'\s*-\s*fix\s*\d*\s*$', '', s, flags=re.I)
              s = re.sub(r'\s*-\s*cosmetic\s*\d*\s*$', '', s, flags=re.I)
              s = re.sub(r'\s*-\s*wip\s*\d+\s*$', '', s, flags=re.I)
              s = re.sub(r'\s*-\s*improvement\s*\d*\s*$', '', s, flags=re.I)
              # 去掉独立尾部的数字编号 (如 "color 2" → "color")
              s = re.sub(r'\s+\d+\s*$', '', s)
              # 去掉 rework - code 尾缀
              s = re.sub(r'\s*-\s*rework\s*-\s*code\s*\d*\s*$', '', s, flags=re.I)
              # 去掉尾部孤立的破折号
              s = re.sub(r'\s*-\s*$', '', s)
              return s.strip()

          seen = set()

          for raw in out:
              s = raw.strip()
              if not s or should_skip(s):
                  continue

              orig = s
              s_lower = s.lower()

              # 分类
              if "new feature" in s_lower or "add new setting" in s_lower or "add setting" in s_lower:
                  cat = CAT_NEW
              elif re.search(r'\b(remove|removed|delete|deleted|drop|dropped)\b', s_lower):
                  cat = CAT_REMOVE
              elif "fix" in s_lower or "hotfix" in s_lower or "hot fix" in s_lower or "workaround" in s_lower:
                  cat = CAT_FIX
              elif "rework" in s_lower or "refactor" in s_lower:
                  cat = CAT_REWORK
              elif "cosmetic" in s_lower:
                  cat = CAT_COSMETIC
              elif "improvement" in s_lower or "improve" in s_lower:
                  cat = CAT_IMPROVE
              else:
                  cat = CAT_OTHER

              cleaned = clean_msg(s)
              if cleaned.lower() in seen:
                  continue
              seen.add(cleaned.lower())
              cat.append(cleaned)

          lines = []

          def emit(title, items):
              if not items:
                  return
              lines.append(f"### {title}")
              for item in items:
                  lines.append(f"- {item}")
              lines.append("")

          emit("新增", CAT_NEW)
          emit("优化", CAT_IMPROVE)
          emit("修复", CAT_FIX)
          emit("移除", CAT_REMOVE)
          emit("重构", CAT_REWORK)
          emit("外观", CAT_COSMETIC)
          emit("其他", CAT_OTHER)

          if not lines:
              lines.append("- 维护性更新")

          print("\n".join(lines))
          PYEOF
          )

          # 输出为多行 output，供后续步骤使用
          {
            echo "body<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or reuse release, upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: ${{ steps.meta.outputs.asset }}
          FORCE: ${{ inputs.force }}
          UPDATE_NOTES: ${{ inputs.update_notes }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在"
            # 幂等回填：即使资产无需上传，也同步更新 Release 说明
            if [ "${UPDATE_NOTES:-true}" = "true" ]; then
              gh release edit "$TAG" --notes "$BODY"
              echo "已刷新 Release 说明"
            fi
            EXISTING=$(gh release view "$TAG" --json assets -q '.assets[].name' || true)
            if grep -qx "$ASSET" <<< "$EXISTING" && [ "${FORCE:-false}" != "true" ]; then
              # 同名资产可能是旧包（例如脚本修复后重建），只有内容 digest 一致才真正跳过
              REMOTE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
                --jq ".assets[] | select(.name == \"$ASSET\") | .digest" || true)
              LOCAL="sha256:$(sha256sum "$ASSET" | cut -d' ' -f1)"
              if [ -n "$REMOTE" ] && [ "$REMOTE" = "$LOCAL" ]; then
                echo "资产 $ASSET 已存在且内容一致，跳过上传"
                exit 0
              fi
              echo "资产内容有变化，覆盖上传 ($REMOTE -> $LOCAL)"
            else
              echo "需要上传或覆盖资产 $ASSET"
            fi
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "$BODY"
          fi

          gh release upload "$TAG" "$ASSET" --clobber
          echo "已上传 $ASSET"

      - name: Summary
        if: always()
        run: |
          {
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| addon id | \`${{ steps.meta.outputs.id }}\` |"
            echo "| 版本 | \`${{ steps.meta.outputs.ver }}\` |"
            echo "| 分支 | \`${{ steps.meta.outputs.branch }}\` |"
            echo "| Release | \`${{ steps.meta.outputs.tag }}\` |"
            echo "| 资产 | \`${{ steps.meta.outputs.asset }}\` |"
            echo "| XBT v3 重打包 | \`${{ steps.textures.outputs.repack }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
